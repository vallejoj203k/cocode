<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Manrope: solo la usa la portada publica. Se precarga la conexion para
         que el titular no parpadee al cambiar de tipografia. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <meta name="description" content="Plataforma de gestion de cursos de programacion para ninos. Varios lenguajes, cada uno con su propio curriculo." />
    <!-- Titulo de partida: cada pagina lo reemplaza al abrirse (hooks/useTitulo.js). -->
    <title>Logic Plus</title>
    <!-- El icono sale de public/logo.svg: cambiar ese fichero cambia tambien la pestana. -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <meta name="theme-color" content="#3178c6" />

    <!-- Vista previa al compartir el enlace por WhatsApp o redes -->
    <meta property="og:title" content="Logic Plus · Programación" />
    <meta property="og:description" content="Varios cursos, cada uno con su lenguaje de programacion. Clases en vivo, una vez por semana, en grupos pequenos. Dejanos tus datos y te llamamos." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
